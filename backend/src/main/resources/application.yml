spring:
  application:
    name: ideaplatform-api
  profiles:
    active: postgres
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

ideaplatform:
  security:
    jwt:
      secret: "change-me-change-me-change-me-change-me-change-me-32+chars"
      issuer: "geistesblitz-mock-keycloak"
      ttl-minutes: 480
    keycloak-mock:
      enabled: true
      realm: "geistesblitz"
      audience: "geistesblitz-api"
  embedding:
    provider: ollama          # ollama | openai | mock
    dimensions: 1024           # bge-m3=1024, nomic-embed-text=768, openai 3-small=1536
    ollama:
      base-url: "http://127.0.0.1:11434"
      # bge-m3: multilingual (strong German), 1024-d. Replaces nomic-embed-text, whose
      # English-primary training compressed German topics into a narrow score band and
      # hurt relevance ranking on the German-canonical corpus.
      model: "bge-m3"
      chat-model: "qwen3.5:2b-q4_K_M"
    openai:
      base-url: "https://api.openai.com/v1"
      api-key: "${OPENAI_API_KEY:}"
      model: "text-embedding-3-small"
      chat-model: "gpt-4o-mini"
  scoring:
    weight-votes: 0.40
    weight-reviewer: 0.35
    weight-recency: 0.15
    weight-sponsor-boost: 0.10
    recency-half-life-days: 30
  rag:
    top-k: 5
    # Sidebar "similar ideas" threshold. Tuned for bge-m3, whose cosine scores run lower
    # than nomic's — 0.45 keeps the sidebar to genuinely-close matches without going empty.
    similarity-threshold: 0.45
  dev:
    # DEV / DEMO ONLY. Exposes the hidden god-mode data editor at /dev in the UI
    # (backed by /api/dev/data/**), which edits any row in any tenant directly,
    # bypassing tenant isolation. MUST be set to false in any production build.
    data-console:
      enabled: true

logging:
  level:
    com.ideaplatform: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
