spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/geistesblitz
    username: geistesblitz
    password: geistesblitz
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration

ideaplatform:
  datastore:
    impl: jpa
