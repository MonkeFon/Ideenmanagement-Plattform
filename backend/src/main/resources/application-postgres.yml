spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/geistesblitz
    username: geistesblitz
    password: geistesblitz
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration

ideaplatform:
  datastore:
    impl: jpa
  embedding:
    # `jdbc` uses raw JdbcTemplate + pgvector — required for JPA mode and for
    # supabase-jdbc mode. The `supabase` profile flips this to `supabase` to call
    # PostgREST RPCs instead.
    store: jdbc

# Demo/dev override: surface full error messages in responses so the SPA's error
# toasts stay informative. Production (any non-postgres profile) keeps the safe
# base default of `never` from application.yml.
server:
  error:
    include-message: always
